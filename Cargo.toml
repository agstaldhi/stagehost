[workspace]
resolver = "2"
members = [
    "crates/audio-core",
    "crates/plugin-host",
    "crates/session-core",
    "crates/ui-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3"
clap-sys = "0.5.0"
vst3 = "0.3.0"
libloading = "0.9.1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
